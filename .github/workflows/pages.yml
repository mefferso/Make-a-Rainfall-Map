name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run smoke tests
        run: npm test
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Smoke test deployed map
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          for attempt in {1..10}; do
            google-chrome --headless --no-sandbox --disable-gpu \
              --virtual-time-budget=15000 --dump-dom \
              "${SITE_URL}?build=${GITHUB_SHA}" > rendered.html 2> chrome.log || true

            if grep -q 'tile.openstreetmap.org' rendered.html \
              && grep -q 'legend-swatch' rendered.html; then
              echo "Live map initialized successfully on attempt ${attempt}."
              exit 0
            fi

            sleep 10
          done

          echo "Live map did not initialize after deployment."
          cat chrome.log
          cat rendered.html
          exit 1
