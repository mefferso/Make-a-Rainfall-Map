<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="description" content="Create cumulative rainfall maps for Louisiana and Mississippi from NOAA gridded precipitation analyses." />
  <title>LA–MS Cumulative Rainfall</title>
  <link rel="preconnect" href="https://tile.openstreetmap.org" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app-shell">
    <header class="toolbar">
      <div class="brand">
        <div class="eyebrow">NOAA gridded precipitation</div>
        <h1>LA–MS Cumulative Rainfall</h1>
      </div>

      <form id="controls" class="controls" autocomplete="off">
        <label>
          <span>Start</span>
          <input id="start-date" type="date" required />
        </label>
        <label>
          <span>End</span>
          <input id="end-date" type="date" required />
        </label>
        <label class="days-field">
          <span>Days</span>
          <input id="days" type="number" min="1" max="366" step="1" value="10" />
        </label>
        <button id="generate" class="primary" type="submit">Generate map</button>
        <button id="download" class="secondary" type="button" disabled>Download PNG</button>
      </form>
    </header>

    <section class="meta-bar" aria-live="polite">
      <div id="period-label">Select a date range</div>
      <div id="source-label">Stage III/IV dates are 24-h periods ending 12Z.</div>
      <div id="max-label"></div>
    </section>

    <section class="map-wrap">
      <div id="map" aria-label="Cumulative rainfall map"></div>
      <div id="loading" class="loading hidden" role="status">
        <div class="loading-card">
          <div class="spinner"></div>
          <div>
            <strong id="loading-title">Loading rainfall data…</strong>
            <div id="loading-detail">Preparing map</div>
          </div>
        </div>
      </div>
      <div id="probe" class="probe hidden">
        <span id="probe-value">—</span>
        <small id="probe-coords"></small>
      </div>
      <div id="legend" class="legend" aria-label="Rainfall legend"></div>
      <div id="error" class="error hidden"></div>
    </section>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script type="module" src="map-runtime.js"></script>
</body>
</html>
